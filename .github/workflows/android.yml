name: APK de Android
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión a la que subir el APK (p. ej. v2.1.0)'
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.release.tag_name || inputs.tag }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Número de versión
        run: |
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: c1tracker
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/c1tracker.p12"
            export KEYSTORE_FILE="$RUNNER_TEMP/c1tracker.p12"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Speakly-$VERSION_NAME-android.apk"
          else
            echo "::warning::Sin clave de firma: se publica un APK firmado con clave de pruebas."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Speakly-$VERSION_NAME-android.apk"
          fi
      - name: Subir el APK a la release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release upload "$TAG" "Speakly-$VERSION_NAME-android.apk" --clobber
