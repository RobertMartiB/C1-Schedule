<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Talkiro</title>
  <meta name="description" content="Talkiro: tu plan de estudio de idiomas para cada día. Inglés de B1 a C1 Advanced con ejercicios en formato Cambridge.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Talkiro">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>try { if (localStorage.getItem('tracker:theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch {}</script>
</head>
<body>
  <header class="top">
    <div class="topleft"><span class="brand"><img src="icon.png" alt="">Talkiro</span><button class="hbtn" id="coursebtn" aria-label="Cambiar de curso" title="Cambiar de curso"></button><button class="hbtn" id="chatbtn" aria-label="Pregúntale a Claude" title="Pregúntale a Claude"><span data-icon="sparkle"></span></button></div>
    <nav class="main">
      <a href="#hoy" data-view="hoy"><span data-icon="home"></span>Hoy</a>
      <a href="#ruta" data-view="ruta"><span data-icon="route"></span>Ruta</a>
      <a href="#vocabulario" data-view="vocabulario"><span data-icon="cards"></span>Palabras</a>
      <a href="#libro" data-view="libro"><span data-icon="book"></span>Libro</a>
      <a href="#series" data-view="series"><span data-icon="film"></span>Series</a>
      <a href="#ajustes" data-view="ajustes" aria-label="Ajustes"><span data-icon="settings"></span><i>Ajustes</i></a>
    </nav>
  </header>
  <main id="main"></main>

  <dialog id="player">
    <div class="phead"><span id="ptitle"></span>
      <div class="row"><button class="icon pbtn" id="pquiz" aria-label="Reto ahora" title="Reto ahora"><span data-icon="target"></span></button><button class="icon pbtn" id="pfull" aria-label="Pantalla completa" title="Pantalla completa"><span data-icon="maximize"></span></button><button class="icon pbtn" id="pclose" aria-label="Cerrar"><span data-icon="x"></span></button></div>
    </div>
    <div class="pstage">
      <video id="video" controls playsinline crossorigin="anonymous" controlslist="nofullscreen nodownload"></video>
      <div id="quiz" hidden></div>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="icons.js"></script>
  <script src="flags.js"></script>
  <script src="courses/registry.js"></script>
  <script src="course.js"></script>
  <script src="reference.js"></script>
  <script src="jellyfin.js"></script>
  <script src="sync.js"></script>
  <script src="vocab.js"></script>
  <script src="unit.js"></script>
  <script src="vendor/anthropic.js"></script>
  <script src="pro.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>
  <script>
    // App instalable en el móvil (no hace falta en la versión de escritorio)
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
