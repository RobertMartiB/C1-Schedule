<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C1 Tracker</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">📘 C1 Advanced</span>
    <nav>
      <a href="#hoy" data-view="hoy">Hoy</a>
      <a href="#calendario" data-view="calendario">Calendario</a>
      <a href="#materiales" data-view="materiales">Materiales</a>
      <a href="#series" data-view="series">Series y pelis</a>
      <a href="#ajustes" data-view="ajustes" aria-label="Ajustes">⚙</a>
    </nav>
  </header>
  <main id="main"></main>

  <dialog id="player">
    <div class="phead"><span id="ptitle"></span><button class="icon" id="pclose" aria-label="Cerrar">✕</button></div>
    <video id="video" controls playsinline crossorigin="anonymous"></video>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="plan.js"></script>
  <script src="jellyfin.js"></script>
  <script src="app.js"></script>
</body>
</html>
