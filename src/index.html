<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>C1 Tracker</title>
  <meta name="theme-color" content="#12141b">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="C1 Tracker">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span class="brand"><img src="icon.png" alt="">C1 Tracker</span>
    <nav class="main">
      <a href="#hoy" data-view="hoy"><span>🏠</span>Hoy</a>
      <a href="#ruta" data-view="ruta"><span>🧭</span>Ruta</a>
      <a href="#vocabulario" data-view="vocabulario"><span>📇</span>Palabras</a>
      <a href="#libro" data-view="libro"><span>📚</span>Libro</a>
      <a href="#series" data-view="series"><span>🎬</span>Series</a>
      <a href="#ajustes" data-view="ajustes" aria-label="Ajustes"><span>⚙</span><i>Ajustes</i></a>
    </nav>
  </header>
  <main id="main"></main>

  <dialog id="player">
    <div class="phead"><span id="ptitle"></span>
      <div class="row"><button class="icon pbtn" id="pquiz" aria-label="Reto ahora" title="Reto ahora">🎯</button><button class="icon pbtn" id="pfull" aria-label="Pantalla completa" title="Pantalla completa">⛶</button><button class="icon pbtn" id="pclose" aria-label="Cerrar">✕</button></div>
    </div>
    <div class="pstage">
      <video id="video" controls playsinline crossorigin="anonymous" controlslist="nofullscreen nodownload"></video>
      <div id="quiz" hidden></div>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="course.js"></script>
  <script src="units/u01.js"></script>
  <script src="units/u02.js"></script>
  <script src="units/u03.js"></script>
  <script src="units/u04.js"></script>
  <script src="units/u05.js"></script>
  <script src="units/u06.js"></script>
  <script src="units/u07.js"></script>
  <script src="units/u08.js"></script>
  <script src="reference.js"></script>
  <script src="jellyfin.js"></script>
  <script src="sync.js"></script>
  <script src="vocab.js"></script>
  <script src="unit.js"></script>
  <script src="app.js"></script>
  <script>
    // App instalable en el móvil (no hace falta en la versión de escritorio)
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
